openapi: 3.0.3
info:
  title: Hotel HMS API
  version: 1.0.0
servers:
  - url: http://localhost:5000
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: OK
  /api/auth/refresh:
    post:
      summary: Refresh access token
      responses:
        "200":
          description: OK
  /api/auth/logout:
    post:
      summary: Logout
      responses:
        "200":
          description: OK
  /api/auth/bootstrap-admin:
    post:
      summary: Bootstrap first admin
      responses:
        "201":
          description: Created
  /api/users:
    get:
      summary: List users (admin)
      responses:
        "200":
          description: OK
  /api/users/me:
    get:
      summary: Get current user profile
      responses:
        "200":
          description: OK
    patch:
      summary: Update current user profile
      responses:
        "200":
          description: OK
  /api/rooms:
    get:
      summary: List rooms
      responses:
        "200":
          description: OK
    post:
      summary: Create room
      responses:
        "201":
          description: Created
  /api/bookings:
    get:
      summary: List bookings
      responses:
        "200":
          description: OK
    post:
      summary: Create booking
      responses:
        "201":
          description: Created
  /api/payments:
    get:
      summary: List payments
      responses:
        "200":
          description: OK
    post:
      summary: Create payment
      responses:
        "201":
          description: Created
  /api/feedback:
    get:
      summary: List feedback
      responses:
        "200":
          description: OK
    post:
      summary: Create feedback
      responses:
        "201":
          description: Created
  /api/menu:
    get:
      summary: List menu items
      responses:
        "200":
          description: OK
    post:
      summary: Create menu item
      responses:
        "201":
          description: Created
  /api/orders:
    get:
      summary: List orders
      responses:
        "200":
          description: OK
    post:
      summary: Create order
      responses:
        "201":
          description: Created
  /api/table-reservations:
    get:
      summary: List table reservations
      responses:
        "200":
          description: OK
    post:
      summary: Create table reservation
      responses:
        "201":
          description: Created
  /api/cleaning:
    get:
      summary: List cleaning tasks
      responses:
        "200":
          description: OK
    post:
      summary: Create cleaning task
      responses:
        "201":
          description: Created
  /api/notifications:
    get:
      summary: List notifications
      responses:
        "200":
          description: OK
  /api/backup/export:
    get:
      summary: Export backup (admin)
      responses:
        "200":
          description: OK
